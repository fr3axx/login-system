{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Nuestros Productos</h1>
    <div class="product-container">
        {% for producto in productos %}
        <div class="product-card">
            {% if producto.imagen %}
            <div>
                <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">
            </div>
            {% else %} 
            <img src="{% static 'img/default-product.png' %}" alt="Imagen no disponible">
            {% endif %}
            <div style="display: flex; align-items: flex-end; margin-top: 10px;">
                <a href="{% url 'producto_detalles' producto.id %}">
                    <h3>{{ producto.nombre }} {{ producto.precio }}$</h3>
                </a>
                <a class="btn btn-carrito" style="margin-left: 20px;" >
                    <img class="carrito-img" src="{% static 'img/carrito.png' %}" alt="Agregar al Carrito" style="max-width:5vh;">
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<style>
    .product-card {
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 15px;
        margin: 15px;
        text-align: center;
        width: 300px;
    }
    .product-card img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
    }
    .product-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
</style>
{% endblock content %}
