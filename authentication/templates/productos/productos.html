{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Nuestros Productos</h1>
    <div class="product-container">
        {% for producto in productos %}
        <div class="product-card">
            {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">
            {% else %} 
            <img src="{% static 'img/default-product.png' %}" alt="Imagen no disponible">
            {% endif %}
            <h3>{{ producto.nombre }} {{ producto.precio }}$</h3>
        </div>
        {% endfor %}
    </div>
</div>
<style>
    .product-card {
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 15px;
        margin: 15px;
        text-align: center;
        width: 300px;
    }
    .product-card img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
    }
    .product-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
</style>
{% endblock content %}
