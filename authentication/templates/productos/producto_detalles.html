{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            {% if producto.imagen %}
            <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="img-fluid">
            {% else %}
            <img src="{% static 'img/default-product.png' %}" alt="Imagen no disponible" class="img-fluid">
            {% endif %}
        </div>
        <div class="col-md-6">
            <h1>{{ producto.nombre }}</h1>
            <div>
                <p>{{ producto.descripcion }}</p>
            </div>

            
            <h3>{{ producto.precio }}$</h3>
            <p><strong>Stock:</strong> {{ producto.stock }}</p>
            <form action="{% url 'agregar_al_carrito' producto.id %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
            </form>
        </div>
    </div>
</div>
<style>
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    .img-fluid {
        max-width: 100%;
        height: auto;
    }
    .btn-primary {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        border: none;
    }
    .btn-primary:hover {
        background-color: #0056b3;
    }
</style>
{% endblock content %}
